name: Deploy MRP Grist widget

on:
  push:
    branches: [main]
    paths:
      - 'MRP/**'
      - '.github/workflows/deploy-mrp.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: MRP/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: MRP
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: MRP
        run: pnpm lint
      - name: Build
        working-directory: MRP
        run: pnpm build
      - name: Prepare Pages site
        run: |
          rm -rf site
          mkdir -p site/MRP
          cp -R MRP/dist/. site/MRP/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check if GitHub Pages is enabled
        id: pages
        run: |
          if curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" >/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled for this repository; skipping deploy."
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4